[workspace.package]
[package]
name = "rsp-client-local"
description = ""
edition = "2021"

[dependencies]
bincode = "1.3.3"

# workspace
rsp-client-executor = { path = "../../crates/executor/client" }
revm-primitives = { version = "9.0.0", features = [
    "std",
    "serde",
], default-features = false }

reth-primitives = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "alloy-compat",
    "optimism",
    "std",
] }

# sp1
sp1-zkvm = "4.0.0"

[features] 
devnet = []
custom-net = []

[patch.crates-io]
# Precompile patches
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-4.0.0" }
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-4.0.0", features = ["groups"] }
kzg-rs = { git = "https://github.com/succinctlabs/kzg-rs", branch = "bhargav/sp1-bls-patch" }
ethereum_hashing = { git = "https://github.com/Atamanov/ethereum_hashing.git"}

sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-4.0.0", package = "sha2" }
ecdsa-core = { git = "https://github.com/sp1-patches/signatures", tag = "patch-0.16.9-sp1-4.0.0", package = "ecdsa" }
bn = { git = "https://github.com/sp1-patches/bn", tag = "patch-0.6.0-sp1-4.0.0", package = "substrate-bn" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-4.0.0" }