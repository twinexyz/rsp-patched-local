[workspace]
members = [
    "bin/host",
    "crates/executor/client",
    "crates/executor/host",
    "crates/mpt",
    "crates/primitives",
    "crates/storage/rpc-db",
    "crates/storage/witness-db",
]
exclude = []
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["puma314", "jtguibas", "rkrasiuk"]
repository = "https://github.com/moongate-forks/minimal-reth"
homepage = "https://github.com/moongate-forks/minimal-reth"
exclude = ["**/target"]
version = "0.1.0"

[workspace.dependencies]
# alloy
alloy = { version = "0.5.4", features = ["full"] }
alloy-primitives = "0.8.0"
alloy-provider = { version = "0.3", default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-rpc-types = { version = "0.3", default-features = false, features = [
    "eth",
] }
alloy-sol-types = "0.8.10"
alloy-rlp = "0.3.4"
alloy-consensus = { version = "0.3", default-features = false }
alloy-transport = { version = "0.3" }
alloy-transport-http = { version = "0.3", features = [
    "reqwest-rustls-tls",
], default-features = false }
alloy-eips = { version = "0.3", default-features = false }
alloy-trie = "0.5.0"

eyre = "0.6"
anyhow = { version = "1.0.86", default-features = false }
tracing = { version = "0.1.40", default-features = false }
cfg-if = "1.0.0"
spin = { version = "0.9.8", features = ["mutex"] }
async-trait = "0.1.80"
tokio = { version = "1.21", default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
serde_json = "1.0.94"
serde = { version = "1.0", default-features = false, features = ["derive"] }
futures = "0.3"
url = "2.3"
thiserror = "1.0.61"
hex-literal = "0.4.1"
rayon = "1.10.0"
rlp = "0.5.2"

# workspace
rsp-rpc-db = { path = "./crates/storage/rpc-db" }
rsp-witness-db = { path = "./crates/storage/witness-db" }
rsp-client-executor = { path = "./crates/executor/client" }
rsp-host-executor = { path = "./crates/executor/host" }
rsp-mpt = { path = "./crates/mpt" }
rsp-primitives = { path = "./crates/primitives" }

# reth
reth-primitives = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "alloy-compat",
    "optimism",
    "std",
] }
reth-codecs = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-consensus = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-evm = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-revm = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "std",
] }
reth-node-ethereum = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-evm-ethereum = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "std",
] }
reth-evm-optimism = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "optimism",
] }
reth-storage-errors = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "std",
] }
reth-trie = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-trie-common = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-chainspec = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-optimism-chainspec = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-execution-errors = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-execution-types = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-db = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-errors = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false }
reth-optimism-consensus = { git = "https://github.com/parajuliswopnil/sp1-reth.git", branch = "rsp-20250124", default-features = false, features = [
    "optimism",
] }

# revm
revm = { version = "14.0.0", features = [
    "optimism",
    "std",
    "serde",
    "kzg-rs",
], default-features = false }
revm-primitives = { version = "9.0.0", features = [
    "std",
    "serde",
], default-features = false }
revm-inspectors = "0.6"
revm-interpreter = { version = "=10.0.1", default-features = false }
revm-precompile = { version = "=11.0.1", default-features = false }

sp1-sdk= { git = "https://github.com/twinexyz/sp1.git", branch = "v4.0.0-twine" }
sp1-helper = { git = "https://github.com/twinexyz/sp1.git", branch = "v4.0.0-twine" }
twine-reth-evm = { git = "https://github.com/twinexyz/twine", branch = "fix/sw/sp1-v4.0.0-twine" }
ark-groth16 = { git = "https://github.com/arkworks-rs/groth16.git" }


[workspace.lints]
rust = { missing_debug_implementations = "warn", unreachable_pub = "warn", unused_must_use = "deny", rust_2018_idioms = { level = "deny", priority = -1, all = "warn" } }

[patch.crates-io]
ethereum_hashing = { git = "https://github.com/Atamanov/ethereum_hashing.git" }
